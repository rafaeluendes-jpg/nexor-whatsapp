services:
  - type: web
    name: nexor-whatsapp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: sessoes
      mountPath: /opt/render/project/src/sessoes
      sizeGB: 1
    envVars:
      - key: CHAVE_API
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # AUDITORIA: sem este segredo o webhook da Meta e recusado por completo.
      # Pegue em: Meta for Developers > seu app > Configuracoes > Basico > Chave secreta.
      - key: META_APP_SECRET
        sync: false
